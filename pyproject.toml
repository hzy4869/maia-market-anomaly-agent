[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maia-investigator"
version = "0.1.0"
description = "Market Anomaly Investigation Agent for FTEC5660"
requires-python = ">=3.10"
dependencies = ["langgraph>=1,<2", "pydantic>=2,<3", "openai>=1,<3", "python-dotenv>=1,<2", "httpx>=0.23,<1", "tzdata>=2025.2", "exchange-calendars>=4.10,<5"]

[project.scripts]
maia = "maia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
